<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#000000"/>
<title>GIFT COIN</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#000;--bg2:#0a0a0a;--glass:rgba(255,255,255,.08);--glass2:rgba(255,255,255,.04);
  --border:rgba(255,255,255,.14);--border2:rgba(255,255,255,.08);
  --txt:#fff;--mut:#8e8e93;--blur:40px;
  --tier-gray:#8e8e93;--tier-cyan:#64d2ff;--tier-blue:#0a84ff;--tier-purple:#bf5af2;--tier-red:#ff453a;--tier-gold:#ffd60a;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%,rgba(255,255,255,.07),transparent),
    radial-gradient(circle at 15% 85%,rgba(255,255,255,.03),transparent 40%),
    radial-gradient(circle at 85% 70%,rgba(255,255,255,.04),transparent 35%),
    linear-gradient(180deg,#000 0%,#050505 50%,#000 100%);
  height:100%;color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;touch-action:manipulation;overflow:hidden}
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;vertical-align:-.15em}
.ic.f{fill:currentColor;stroke:none}
#app{max-width:430px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative}

/* liquid glass base */
.glass{
  background:linear-gradient(135deg,rgba(255,255,255,.12) 0%,rgba(255,255,255,.04) 40%,rgba(255,255,255,.08) 100%);
  backdrop-filter:blur(var(--blur)) saturate(180%);-webkit-backdrop-filter:blur(var(--blur)) saturate(180%);
  border:1px solid var(--border);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 8px 32px rgba(0,0,0,.45);
  position:relative;overflow:hidden}
.glass::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.22) 0%,transparent 35%,rgba(255,255,255,.06) 60%,transparent 80%);
  opacity:.45}
.glass::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.04'/%3E%3C/svg%3E");
  opacity:.35;mix-blend-mode:overlay}

.hd{display:flex;align-items:center;gap:10px;padding:12px 16px 10px;flex:none;z-index:2}
.hd.glass{border-radius:0;border-left:0;border-right:0;border-top:0}
.hd .ttl{flex:1;text-align:center;font-size:13px;font-weight:600;letter-spacing:2px;text-transform:uppercase}
.hd .side{width:36px;height:36px;display:grid;place-items:center;color:var(--mut);flex:none;z-index:1}
.hd .ava{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;
  backdrop-filter:blur(20px);border:1px solid var(--border2)}
.hd .back{cursor:pointer}

.sc{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 14px 100px;-webkit-overflow-scrolling:touch;z-index:1}
.sc::-webkit-scrollbar{width:0}

.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;z-index:30;
  display:flex;justify-content:space-around;padding:6px 2px calc(8px + env(safe-area-inset-bottom));
  border-radius:22px 22px 0 0;border-bottom:0}
.nav button{background:none;border:0;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:9px;letter-spacing:.2px;width:19%;cursor:pointer;padding:6px 0;position:relative;z-index:1}
.nav button .gi{font-size:20px;line-height:1}
.nav button.on{color:var(--txt)}
.nav button.on .gi{filter:drop-shadow(0 0 8px rgba(255,255,255,.5))}

.card{border-radius:18px;margin-bottom:10px;position:relative;z-index:1}
.card.pad{padding:14px}
.row{display:flex;align-items:center;gap:11px;padding:12px 13px}
.row .bx{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.08);display:grid;place-items:center;
  color:var(--mut);font-size:16px;flex:none;border:1px solid var(--border2);backdrop-filter:blur(16px)}
.row .t{flex:1;min-width:0}
.row .t b{font-size:13px;font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{font-size:10px;color:var(--mut);margin-top:2px;display:block}
.btnw{background:#fff;color:#000;border:0;border-radius:12px;padding:7px 16px;font-size:11px;font-weight:700;cursor:pointer;
  box-shadow:0 4px 16px rgba(255,255,255,.15)}
.btnd{background:rgba(255,255,255,.1);color:var(--txt);border:1px solid var(--border2);border-radius:12px;
  padding:7px 16px;font-size:11px;font-weight:600;cursor:pointer;backdrop-filter:blur(12px)}
.btnw:active,.btnd:active,.nav button:active,.pill:active,.coin:active{transform:scale(.96)}
.pill{font-size:10px;padding:6px 14px;border-radius:999px;border:1px solid var(--border2);
  background:rgba(255,255,255,.06);color:var(--mut);cursor:pointer;backdrop-filter:blur(12px);white-space:nowrap}
.pill.on{background:#fff;color:#000;border-color:#fff;font-weight:600}
.tabs{display:flex;gap:6px;margin:2px 0 12px;overflow-x:auto;padding-bottom:2px}
.tabs::-webkit-scrollbar{height:0}
.bar{height:4px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:3px;transition:width .3s ease}
.mut{color:var(--mut)}.num{font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.two .card{padding:12px;text-align:center}
.two small{font-size:9px;color:var(--mut);display:block;margin-bottom:3px;letter-spacing:.5px}
.two b{font-size:16px;font-weight:700}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.three .card{padding:10px 6px;text-align:center;font-size:10px}
.three b{font-size:14px;display:block;margin-top:2px}

/* coin tap */
.bal{text-align:center;margin-top:4px}
.bal .v{font-size:32px;font-weight:800;letter-spacing:-.5px}
.bal .u{font-size:10px;letter-spacing:5px;color:var(--mut);margin-top:2px}
.bal .pt{font-size:12px;color:var(--mut);margin-top:4px}
.coinwrap{position:relative;display:grid;place-items:center;margin:18px 0;user-select:none}
.coin{width:168px;height:168px;border-radius:50%;display:grid;place-items:center;font-size:58px;
  background:radial-gradient(circle at 38% 32%,#555 0%,#222 42%,#000 100%);
  border:2px solid rgba(255,255,255,.25);cursor:pointer;position:relative;z-index:2;
  box-shadow:0 20px 50px rgba(0,0,0,.8),inset 0 2px 12px rgba(255,255,255,.25),inset 0 -10px 24px rgba(0,0,0,.6)}
.coinwrap.flash::before{content:'';position:absolute;width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.5) 0%,transparent 70%);filter:blur(20px);
  opacity:0;animation:flash .2s ease-out forwards;pointer-events:none}
.coin.pop{animation:pop .15s ease-out}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(.92)}100%{transform:scale(1)}}
@keyframes flash{0%{opacity:0;transform:scale(.8)}50%{opacity:1}100%{opacity:0;transform:scale(1.1)}}
.float{position:absolute;z-index:5;font-weight:800;font-size:18px;pointer-events:none;
  animation:fu .75s ease-out forwards;text-shadow:0 2px 8px #000}
@keyframes fu{0%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-70px) scale(1.2)}}

/* prize tiers */
.tier-dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.tier-gray{background:var(--tier-gray)}.tier-cyan{background:var(--tier-cyan)}
.tier-blue{background:var(--tier-blue)}.tier-purple{background:var(--tier-purple)}
.tier-red{background:var(--tier-red)}.tier-gold{background:var(--tier-gold);box-shadow:0 0 8px var(--tier-gold)}

/* wheel */
.wheel-box{display:grid;place-items:center;margin:16px 0}
.wheel{width:220px;height:220px;border-radius:50%;position:relative;border:3px solid rgba(255,255,255,.2);
  box-shadow:0 0 40px rgba(255,255,255,.08);transition:transform 4s cubic-bezier(.17,.67,.12,.99)}
.wheel.spinning{pointer-events:none}
.wheel-pointer{position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:0;height:0;
  border-left:10px solid transparent;border-right:10px solid transparent;border-top:16px solid #fff;z-index:3;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}

/* case cards */
.case-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.case-item{border-radius:18px;padding:14px 12px;text-align:center;cursor:pointer}
.case-item .ico{font-size:32px;margin-bottom:8px;display:flex;align-items:center;justify-content:center;height:110px}
.case-item .ico img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5))}
.case-item b{font-size:12px;display:block;margin-bottom:4px}
.case-item small{font-size:10px;color:var(--mut)}

/* vault grid */
.vault-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.vault-item{border-radius:14px;padding:12px 8px;text-align:center;font-size:10px}
.vault-item .prize-ico{font-size:24px;margin-bottom:4px}

/* quiz */
.quiz-q{font-size:15px;font-weight:600;margin-bottom:14px;line-height:1.4}
.quiz-opt{display:block;width:100%;text-align:left;margin-bottom:8px;padding:12px 14px;border-radius:14px;
  background:rgba(255,255,255,.06);border:1px solid var(--border2);color:var(--txt);font-size:13px;cursor:pointer}
.quiz-opt.correct{border-color:#fff;background:rgba(255,255,255,.15)}
.quiz-opt.wrong{opacity:.4}

/* clan */
.clan-banner{border-radius:18px;padding:20px;text-align:center;margin-bottom:12px}
.clan-logo{width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,.1);display:grid;place-items:center;
  font-size:24px;margin:0 auto 10px;border:1px solid var(--border)}

/* subscription */
.sub-hero{border-radius:20px;padding:24px 18px;text-align:center;margin-bottom:14px;
  background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.04))}
.sub-hero h3{font-size:18px;font-weight:700;margin-bottom:6px}
.sub-hero p{font-size:11px;color:var(--mut);line-height:1.5}
.sub-feat{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border2)}
.sub-feat:last-child{border:0}
.sub-feat .ck{color:#fff;font-size:14px;margin-top:1px}

/* vip badges */
.vip-row{display:flex;gap:6px;overflow-x:auto;padding:4px 0 12px}
.vip-badge{flex:none;padding:8px 14px;border-radius:12px;font-size:10px;font-weight:600;
  border:1px solid var(--border2);background:rgba(255,255,255,.05);color:var(--mut)}
.vip-badge.active{background:#fff;color:#000;border-color:#fff}

/* leaderboard */
.rk{width:22px;text-align:center;color:var(--mut);font-size:11px;font-weight:600}
.me{border-color:rgba(255,255,255,.5)!important;background:rgba(255,255,255,.1)!important}

/* section title */
.sec{font-size:10px;color:var(--mut);letter-spacing:1.5px;text-transform:uppercase;margin:14px 2px 8px}

/* upgrader */
.upgrade-zone{border-radius:20px;padding:24px;text-align:center;margin-bottom:12px;min-height:160px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.upgrade-zone .slot{width:72px;height:72px;border-radius:18px;border:2px dashed var(--border);
  display:grid;place-items:center;font-size:28px;background:rgba(255,255,255,.04)}
.upgrade-arrows{font-size:20px;color:var(--mut);letter-spacing:8px}

.full{width:100%;border:0;border-radius:14px;padding:13px;font-size:13px;font-weight:600;margin-top:8px;cursor:pointer}
.full.w{background:#fff;color:#000}
.full.g{background:rgba(255,255,255,.1);color:var(--txt);border:1px solid var(--border2)}

#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(16px);
  background:rgba(255,255,255,.95);color:#000;padding:10px 18px;border-radius:22px;font-size:12px;font-weight:600;
  opacity:0;pointer-events:none;transition:.25s;z-index:100;max-width:85%;text-align:center;
  backdrop-filter:blur(20px);box-shadow:0 8px 32px rgba(0,0,0,.4)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.load{display:grid;place-items:center;height:100%;color:var(--mut);font-size:13px;padding:30px;text-align:center;line-height:1.6}
.menu .row{cursor:pointer}
.empty{text-align:center;padding:32px 20px;color:var(--mut);font-size:12px;line-height:1.6}
.badge{font-size:9px;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.12);color:var(--mut);
  border:1px solid var(--border2)}
.badge.hot{background:#fff;color:#000;font-weight:700}
</style>
</head>

<script>
/* ============================================================
   GIFT COIN — Telegram Mini App (single file, no build step)
   Deploy this file as-is to Vercel (Static / "Other" preset).
   ============================================================ */

/* >>> Backend URL — override at runtime with ?api=https://... for testing. */
const API_BASE = (new URLSearchParams(location.search).get('api'))
  || (location.protocol === 'file:' ? 'http://localhost:3001' : 'https://api.richmachine.ru');
const TG = window.Telegram && window.Telegram.WebApp;
const $ = (s, r = document) => r.querySelector(s);
const fmt = n => Math.floor(n).toLocaleString('ru-RU');
const I = id => `<svg class="ic"><use href="#${id}"/></svg>`;

const PRIZE_TIERS = [
  { id:'gray', name:'Серый', chance:'40%', color:'tier-gray', emoji:'⚪' },
  { id:'cyan', name:'Голубой', chance:'20%', color:'tier-cyan', emoji:'🔵' },
  { id:'blue', name:'Синий', chance:'10%', color:'tier-blue', emoji:'💎' },
  { id:'purple', name:'Фиолетовый', chance:'3%', color:'tier-purple', emoji:'💜' },
  { id:'red', name:'Красный', chance:'1%', color:'tier-red', emoji:'🔴' },
  { id:'gold', name:'Золотой', chance:'0.01%', color:'tier-gold', emoji:'⭐' },

function loadLocal() {
  try { return JSON.parse(localStorage.getItem('gc_local') || '{}'); }
  catch { return {}; }
}
function saveLocal() { localStorage.setItem('gc_local', JSON.stringify(state.local)); }
function ensureLocal() {
  const d = state.local;
  if (!d.vault) d.vault = [{ tier:'gray', name:'50 Stars', emoji:'⚪' }];
  if (!d.wheelLast) d.wheelLast = 0;
  if (!d.achievements) d.achievements = { taps:0, cases:0, refs:0 };
  if (!d.subscription) d.subscription = false;
  if (!d.clan) d.clan = null;
  if (d.totalTaps === undefined) d.totalTaps = 0;
  saveLocal();
}

function tgReady() {
  if (!TG) return;
  try { TG.ready(); TG.expand(); TG.setBackgroundColor('#000000'); TG.setHeaderColor('#000000'); } catch(e){}
}
function haptic(k='light') {
  const h = TG && TG.HapticFeedback; if (!h) return;
  try { k==='success'||k==='error'||k==='warning' ? h.notificationOccurred(k) : h.impactOccurred(k); } catch(e){}
}

const TOKEN_KEY = 'gc_token';
function token() { return localStorage.getItem(TOKEN_KEY); }
async function api(path, body) {
  const headers = { 'Content-Type':'application/json' };
  const t = token(); if (t) headers['Authorization'] = 'Bearer '+t;
  const res = await fetch(API_BASE + path, {
    method: body===undefined ? 'GET' : 'POST', headers,
    body: body===undefined ? undefined : JSON.stringify(body),
  });
  const data = await res.json().catch(()=>({}));
  if (!res.ok) { const e = new Error(data.error||('HTTP '+res.status)); e.status = res.status; throw e; }
  return data;
}
function getInitData() {
  if (TG && TG.initData) return TG.initData;
  try {
    const hash = location.hash.startsWith('#') ? location.hash.slice(1) : location.hash;
    return decodeURIComponent(new URLSearchParams(hash).get('tgWebAppData')||'');
  } catch { return ''; }
}
async function auth() {
  const r = await api('/auth', { initData: getInitData() });
  localStorage.setItem(TOKEN_KEY, r.token);
  return r.user;
}
async function ensureAuth() {
  if (token()) { try { return (await api('/me')).user; } catch(e) { if (e.status!==401) throw e; } }
  return await auth();
}

function go(screen) {
  if (ROOTS.includes(screen)) state.tab = screen;
  state.screen = screen;
  if (screen==='profile' || screen==='friends') {
    api('/friends').then(r=>{ state.friends=r.list; render(); }).catch(()=>{});
  }
  render();
}

function header(title, nested) {
  const left = nested

    : `<div class="ava" data-act="go" data-to="profile">${I('i-user')}</div>`;

function rollTier(weights) {
  const r = Math.random()*100;
  let acc = 0;
  for (const t of weights) { acc += t.p; if (r <= acc) return t; }
  return weights[0];
}

function updateEarnNumbers() {
  const u = state.user; if (!u) return;
  const b=$('#bal'), e=$('#entxt'), bar=$('#enbar');
  if (b) b.textContent = fmt(u.balance);
  if (e) e.textContent = fmt(u.energy)+' / '+fmt(u.maxEnergy);
  if (bar) bar.style.width = Math.round(u.energy/u.maxEnergy*100)+'%';
}

let pending=0, flushTimer=null;
function bindCoin() {
  const coin=$('#coin'), wrap=$('#coinwrap');
  if (!coin) return;
  coin.onpointerdown = ev => {
    ev.preventDefault();
    const u = state.user;
    if (u.energy<=0) { haptic('error'); toast('Энергия закончилась'); return; }
    haptic('light');
    const mult = state.local.subscription ? 2 : 1;
    u.balance += u.tapPower*mult;
    u.energy = Math.max(0, u.energy-1);
    state.local.totalTaps++;
    state.local.achievements.taps++;
    saveLocal();
    updateEarnNumbers();
    wrap.classList.remove('flash'); void wrap.offsetWidth; wrap.classList.add('flash');
    coin.classList.remove('pop'); void coin.offsetWidth; coin.classList.add('pop');
    spawnFloat(wrap, ev, '+'+(u.tapPower*mult));
    if (Math.random()<0.02) {
      const tier = rollTier([{p:40,t:'gray'},{p:20,t:'cyan'},{p:10,t:'blue'},{p:3,t:'purple'},{p:1,t:'red'},{p:0.01,t:'gold'}]);
      const t = PRIZE_TIERS.find(x=>x.id===tier.t);
      state.local.vault.push({ tier:t.id, name:t.name+' приз', emoji:t.emoji });
      saveLocal(); toast('Приз: '+t.name+'!');
    }
    pending++;
    if (!flushTimer) flushTimer = setInterval(flushTaps, 700);
  };
}
function spawnFloat(wrap, ev, txt) {
  const r = wrap.getBoundingClientRect();
  const s = document.createElement('span');
  s.className='float'; s.textContent=txt;
  s.style.left=(ev.clientX-r.left)+'px'; s.style.top=(ev.clientY-r.top)+'px';
  wrap.appendChild(s); setTimeout(()=>s.remove(), 750);
}
async function flushTaps() {
  const n=pending; if (!n) return; pending=0;
  try { const r=await api('/tap',{count:n}); state.user=r.user; updateEarnNumbers(); } catch(e){}
}

async function loadLeaderboard() {
  try {
    const r = await api('/leaderboard');
    const box = $('#lbrows'); if (!box) return;
    box.innerHTML = r.rows.map(row=>`<div class="card glass row ${row.me?'me':''}">
      <span class="rk">${row.rank}</span><div class="bx" style="font-size:12px">${row.rank<=3?I('i-medal'):I('i-user')}</div>
      <div class="t"><b>${row.name}</b></div><b class="num">${row.score}</b></div>`).join('');
  } catch(e) {
    const box = $('#lbrows');
    if (box) box.innerHTML = [{n:'@whale',s:'2.5B'},{n:'@tap_king',s:'1.2B'},{n:'@you',s:fmt(state.user.balance),me:1}]
      .map((row,i)=>`<div class="card glass row ${row.me?'me':''}">
        <span class="rk">${i+1}</span><div class="t"><b>${row.n}</b></div><b class="num">${row.s}</b></div>`).join('');
  }
}

function openCase(id) {
  const c = CASES.find(x=>x.id===id);
  if (!c || state.user.balance < c.price) { haptic('error'); toast('Недостаточно коинов'); return; }
  state.user.balance -= c.price;
  state.local.achievements.cases++;
  const weights = id==='basic'
    ? [{p:50,t:'gray'},{p:35,t:'cyan'},{p:15,t:'blue'}]
    : id==='premium'
    ? [{p:40,t:'cyan'},{p:35,t:'blue'},{p:20,t:'purple'},{p:5,t:'red'}]
    : [{p:30,t:'blue'},{p:35,t:'purple'},{p:25,t:'red'},{p:10,t:'gold'}];
  const tier = rollTier(weights);
  const t = PRIZE_TIERS.find(x=>x.id===tier.t);
  state.local.vault.push({ tier:t.id, name:c.name+' · '+t.name, emoji:t.emoji });
  saveLocal(); haptic('success'); toast('Выпало: '+t.name+' '+t.emoji); render();
}

document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  try {
    if (act==='go') go(el.dataset.to);
    else if (act==='back') back();
    else if (act==='ttab') { state.tasksTab=el.dataset.v; render(); }
    else if (act==='ctab') { state.casesTab=el.dataset.v; render(); }
    else if (act==='ltab') { state.lbTab=el.dataset.v; render(); }
    else if (act==='claim') {
      if (el.dataset.link && TG) TG.openTelegramLink('https://'+el.dataset.link);
      try {
        const r = await api('/claim',{taskId:el.dataset.id});
        state.user=r.user; haptic('success'); toast('+'+fmt(r.reward)); render();
      } catch {
        state.user.balance += 50000; haptic('success'); toast('+50,000 (demo)'); render();
      }
    }
    else if (act==='boost') {
      const r = await api('/boost',{boostId:el.dataset.id});
      if (!r.ok) { haptic('error'); toast(r.error||'Мало коинов'); }
      else { state.user=r.user; haptic('success'); toast('Улучшено!'); }
      render();
    }
    else if (act==='open-case') openCase(el.dataset.id);
    else if (act==='pick-upgrade') {
      if (!state.local.vault.length) { toast('Хранилище пусто'); return; }
      state.upgradeSlot = state.local.vault[0]; render(); toast('Приз выбран');
    }
    else if (act==='do-upgrade') {
      if (!state.upgradeSlot || state.user.balance<50000) { toast('Недостаточно коинов'); return; }
      state.user.balance -= 50000;
      const idx = state.local.vault.indexOf(state.upgradeSlot);
      if (idx>=0) state.local.vault.splice(idx,1);
      if (Math.random()<0.5) {
        const tiers = PRIZE_TIERS.map(t=>t.id);
        const cur = tiers.indexOf(state.upgradeSlot.tier);
        const next = PRIZE_TIERS[Math.min(cur+1, tiers.length-1)];
        state.local.vault.push({ tier:next.id, name:'Upgraded '+next.name, emoji:next.emoji });
        haptic('success'); toast('Успех! '+next.name);
      } else { haptic('error'); toast('Приз потерян…'); }
      state.upgradeSlot=null; saveLocal(); render();
    }
    else if (act==='spin-wheel' || act==='spin-wheel-paid') {
      if (state.wheelSpinning) return;
      const paid = act==='spin-wheel-paid';
      const free = Date.now()-(state.local.wheelLast||0)>86400000;
      if (!paid && !free) return;
      if (paid && state.user.balance<100000) { toast('Нужно 100,000'); return; }
      if (paid) state.user.balance -= 100000;
      else state.local.wheelLast = Date.now();
      state.wheelSpinning = true;
      const wheel = $('#wheel');
      const extra = 1800 + Math.random()*1800;
      state.wheelAngle += extra;
      if (wheel) { wheel.classList.add('spinning'); wheel.style.transform=`rotate(${state.wheelAngle}deg)`; }
      setTimeout(()=>{
        state.wheelSpinning=false;
        const rewards = [100000,500000,50000,200000,250000,1000000,75000,300000];
        const win = rewards[Math.floor(Math.random()*rewards.length)];
        state.user.balance += win; saveLocal(); haptic('success'); toast('+'+fmt(win)+'!');
        render();
      }, 4000);
    }
    else if (act==='quiz-answer') {
      const q = QUIZ[state.quizIdx];
      const opts = document.querySelectorAll('.quiz-opt');
      opts.forEach((o,i)=>{ o.classList.add(i===q.a?'correct':'wrong'); o.disabled=true; });
      if (+el.dataset.i===q.a) state.quizScore++;
      setTimeout(()=>{ state.quizIdx++; render(); }, 800);
    }
    else if (act==='quiz-restart') { state.quizIdx=0; state.quizScore=0; render(); }
    else if (act==='buy-sub') {
      if (state.local.subscription) { toast('Подписка уже активна'); return; }
      if (state.user.balance<2500000) { toast('Нужно 2,500,000 коинов'); return; }
      state.user.balance-=2500000; state.local.subscription=true; saveLocal();
      haptic('success'); toast('PRO активирован!'); render();
    }
    else if (act==='create-clan') {
      if (state.user.balance<50000000) { toast('Нужно 50,000,000'); return; }
      state.user.balance-=50000000;
      state.local.clan={name:'My Clan',logo:'🛡️',members:1,rank:99,warTaps:0};
      saveLocal(); haptic('success'); toast('Клан создан!'); render();
    }
    else if (act==='join-clan') {
      state.local.clan={name:'Alpha Tappers',logo:'⚔️',members:87,rank:3,warTaps:1250000};
      saveLocal(); haptic('success'); toast('Вы вступили в клан!'); render();
    }
    else if (act==='leave-clan') { state.local.clan=null; saveLocal(); toast('Вы покинули клан'); render(); }
    else if (act==='daily-claim') {
      const day = Math.min(7, Math.floor(state.local.totalTaps/500)+1);
      const reward = 50000+day*25000;
      state.user.balance+=reward; haptic('success'); toast('+'+fmt(reward)); render();
    }
    else if (act==='invite') {
      haptic('light');
      const link = 'https://t.me/share/url?url='+encodeURIComponent('https://t.me/giftcoin_bot?start='+(state.user.id||''))
        +'&text='+encodeURIComponent('GIFT COIN — тапай, зарабатывай, выигрывай!');
      if (TG) TG.openTelegramLink(link); else navigator.clipboard?.writeText(link); toast('Ссылка скопирована');
    }
    else if (act==='buy') { haptic('warning'); toast('Оплата скоро'); }
    else if (act==='soon') { haptic('light'); toast('Скоро'); }
    else if (act==='vault-item') toast('Приз: '+state.local.vault[+el.dataset.i]?.name);
  } catch(e) { haptic('error'); toast('Ошибка'); }
});

(async function boot() {
  tgReady();
  ensureLocal();
  try {
    state.user = await ensureAuth();
  } catch(e) {
    state.user = demoUser();
    toast('Demo режим — backend недоступен');
  }
  render();
})();
</script>
