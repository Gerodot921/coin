<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gift Coin Mockup Preview</title>
    <style>
      :root {
        color-scheme: light;
      }

      html, body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(circle at top, rgba(255, 255, 255, 0.9), rgba(237, 237, 237, 0.98) 45%, rgba(220, 220, 220, 1) 100%);
        font-family: "Nunito", "Trebuchet MS", "Arial Rounded MT Bold", sans-serif;
      }

      .wrap {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 24px;
        box-sizing: border-box;
      }

      .frame {
        width: min(100%, 920px);
        background: rgba(255, 255, 255, 0.65);
        border: 1px solid rgba(17, 17, 17, 0.12);
        border-radius: 28px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.12);
        overflow: auto;
      }

      img {
        display: block;
        width: 100%;
        height: auto;
      }

      @media (max-width: 980px) {
        .wrap {
          padding: 12px;
        }

        .frame {
          border-radius: 22px;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="frame">
        <img src="gift-coin-mini-app-mockup.svg" alt="Gift Coin UI mockup" />
      </div>
    </div>
  </body>
</html>
